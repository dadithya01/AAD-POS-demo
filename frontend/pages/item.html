<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item</title>
</head>

<body class="bg-[#030712] text-white">
    <div>
        <nav class="mx-5 mt-5 fixed left-0 right-0">
            <ul class="flex flex-wrap justify-center items-center gap-4 p-4 bg-[#1b1f29] 
               mx-auto max-w-4xl rounded-[30px] md:rounded-[50px] font-bold text-white">
                <li>
                    <a onclick="window.location.href ='../index.html'"
                        class="px-3 py-2 transition-colors duration-200 hover:text-sky-400 cursor-pointer block">
                        Home
                    </a>
                </li>
                <li>
                    <a onclick="window.location.href ='customer.html'"
                        class="px-3 py-2 transition-colors duration-200 hover:text-sky-400 cursor-pointer block">
                        Customer
                    </a>
                </li>
                <li>
                    <a onclick="window.location.href ='item.html'"
                        class="px-3 py-2 transition-colors duration-200 hover:text-sky-400 cursor-pointer block">
                        Item
                    </a>
                </li>
                <li>
                    <a onclick="window.location.href ='order.html'"
                        class="px-3 py-2 transition-colors duration-200 hover:text-sky-400 cursor-pointer block">
                        Order
                    </a>
                </li>
            </ul>
        </nav>

        <div class="min-h-screen flex items-center justify-center">
            <div class="max-w-4xl mx-auto text-white w-300">
                <h1 class="text-center font-bold text-[40px] underline mb-10">
                    Item Management
                </h1>

                <div class="bg-[#10141e] p-10 rounded-[20px] form-container">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-15">

                        <div class="flex flex-col gap-2 md:col-span-2 lg:col-span-1 form-group">
                            <label for="itemId" class="text-[20px] font-bold ml-4">Item Id</label>
                            <input id="itemId" type="text" placeholder="I001"
                                class="p-3 rounded-[50px] w-full font-bold focus:outline-none focus:ring-2 focus:ring-blue-500" />
                        </div>

                        <div class="flex flex-col gap-2 form-group">
                            <label for="itemName" class="text-[20px] font-bold ml-4">Item Name</label>
                            <input id="itemName" type="text" placeholder="Knee guard"
                                class="p-3 rounded-[50px] w-full font-bold focus:outline-none focus:ring-2 focus:ring-blue-500" />
                        </div>

                        <div class="flex flex-col gap-2 form-group">
                            <label for="itemDesc" class="text-[20px] font-bold ml-4">Item Description</label>
                            <input id="itemDesc" type="text" placeholder="Description"
                                class="p-3 rounded-[50px] w-full font-bold focus:outline-none focus:ring-2 focus:ring-blue-500" />
                        </div>

                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 mt-10 btn-group">
                        <button onclick="saveItem()"
                            class="bg-transparent border-2 border-indigo-600 cursor-pointer px-4 py-3 font-bold text-[18px] rounded-[50px] transition-all duration-300 hover:bg-white hover:text-black hover:border-none">
                            Save
                        </button>
                        <button onclick="getAllItem()"
                            class="bg-transparent border-2 border-indigo-600 cursor-pointer px-4 py-3 font-bold text-[18px] rounded-[50px] transition-all duration-300 hover:bg-white hover:text-black hover:border-none">
                            Get All
                        </button>
                        <button onclick="updateItem()"
                            class="bg-transparent border-2 border-indigo-600 cursor-pointer px-4 py-3 font-bold text-[18px] rounded-[50px] transition-all duration-300 hover:bg-white hover:text-black hover:border-none">
                            Update
                        </button>
                        <button onclick="deleteItem()"
                            class="bg-transparent border-2 border-indigo-600 cursor-pointer px-4 py-3 font-bold text-[18px] rounded-[50px] transition-all duration-300 hover:bg-white hover:text-black hover:border-none">
                            Delete
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div>
            <table id="itemTable">
                <thead>
                    <tr>
                        <th>Item Id</th>
                        <th>Item Name</th>
                        <th>Item Description</th>
                    </tr>
                </thead>
                <tbody id="itemList">

                </tbody>
            </table>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        window.onload(
            getAllItem()
        )

        function saveItem() {
            const iid = $('#itemId').val()
            const iname = $('#itemName').val()
            const iDesc = $('#itemDesc').val()
            $.ajax({
                url: 'http://localhost:8080/backend/api/v1/item',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    "iid": iid,
                    "iname": iname,
                    "iDesc": iDesc
                }),
                success: function (response) {
                    alert(response)
                    getAllItem()
                },
                error: function (error) {
                    alert(error)
                }
            })
        }

        function updateItem() {

            const iid = $('#itemId').val()
            const iname = $('#itemName').val()
            const iDesc = $('#itemDesc').val()
            $.ajax({
                url: 'http://localhost:8080/backend/api/v1/item',
                method: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify({
                    "iid": iid,
                    "iname": iname,
                    "iDesc": iDesc
                }),
                success: function (response) {
                    alert(response)
                    getAllItem();
                },
                error: function (error) {
                    alert(error)
                }
            })
        }

        function deleteItem() {
            const iid = $('#itemId').val()
            $.ajax({
                url: 'http://localhost:8080/backend/api/v1/item?iid=' + iid,
                method: 'DELETE',
                success: function (response) {
                    alert(response)
                    getAllItem();
                },
                error: function (error) {
                    alert(error)
                }
            })
        }

        function getAllItem() {
            $.ajax({
                url: 'http://localhost:8080/backend/api/v1/item',
                method: 'GET',
                success: function (response) {
                    $('#itemList').empty()
                    for(let item of response){
                    const row ="<tr><td>"+item.iid+"</td><td>"+item.iname+"</td><td>"+item.iDesc+"</td></tr>"
                    $('#itemList').append(row)
                }
                    alert("Items Retrieved Successfully")
                },
                error: function (error) {
                    alert(error)
                }
            })
        }

    </script>

</body>

</html>
